# Sandbox Postgres for the OSS self-hosted pivot (architecture-002, Phase 1).
#
# This is an ISOLATED dev target, not wired into the running app. Auth + the real
# cutover now run against docker-compose.local.yml's distinct container instead
# (architecture-002 Phase 2/3, feature-017) — this sandbox stays around only as a
# disposable target for future migration dry-runs.
#
# IMPORTANT: always pass -p to avoid Compose's default (directory-name-derived)
# project name colliding with docker-compose.local.yml's containers — this has
# already happened once (an `up` on one file silently recreated/removed the
# other's container, since both defaulted to the same project name).
#
# Usage:
#   docker compose -p investment-tracker-selfhost -f docker-compose.selfhost.yml up -d
#   docker compose -p investment-tracker-selfhost -f docker-compose.selfhost.yml down        # stop, keep data
#   docker compose -p investment-tracker-selfhost -f docker-compose.selfhost.yml down -v     # stop, wipe sandbox data
#
# Applying the existing Alembic migrations against this sandbox (proves the schema
# stands up cleanly on vanilla Postgres, no Supabase-specific dependency):
#   cd backend && source .venv/bin/activate
#   DATABASE_URL=postgresql+asyncpg://selfhost_user:selfhost_pass@localhost:5432/investment_tracker_selfhost \
#   ADMIN_DATABASE_URL=postgresql+asyncpg://selfhost_user:selfhost_pass@localhost:5432/investment_tracker_selfhost \
#   DB_SSL= \
#   alembic upgrade head
#
# The DATABASE_URL/ADMIN_DATABASE_URL/DB_SSL overrides above are process-env only —
# they do NOT touch backend/.env, so the real running app is unaffected.

services:
  postgres:
    image: postgres:16
    container_name: investment_tracker_selfhost_postgres
    environment:
      POSTGRES_USER: selfhost_user
      POSTGRES_PASSWORD: selfhost_pass
      POSTGRES_DB: investment_tracker_selfhost
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - investment_tracker_selfhost_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfhost_user -d investment_tracker_selfhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  investment_tracker_selfhost_data:
