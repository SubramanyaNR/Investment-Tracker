# One-command self-host stack for external self-hosters (README "Quick start").
#
# `cp .env.example .env`, fill in POSTGRES_PASSWORD / JWT_SECRET / ADMIN_EMAIL / ADMIN_PASSWORD,
# then `docker compose up -d --build`. Runs postgres + backend (runs Alembic migrations on boot,
# then uvicorn) + frontend.
#
# This is a separate stack from docker-compose.local.yml (the founder's own real-data Postgres
# container, driven by the Makefile/systemd path) and docker-compose.selfhost.yml (a disposable
# migration-dry-run sandbox). If you ever bring more than one of these up on the same host, pass
# distinct `-p` project names — Compose's default directory-derived project name is shared across
# all three, and an `up`/`down` on one has previously recreated/removed another's container.

services:
  postgres:
    image: postgres:16
    container_name: wealthsignal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investment_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-investment_tracker}
    volumes:
      - wealthsignal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investment_admin} -d ${POSTGRES_DB:-investment_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: wealthsignal_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides whatever's in .env — inside Compose's network, Postgres is reached by service
      # name, not localhost. No RLS/multi-role split (single-user app), so both DSNs match.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-investment_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-investment_tracker}
      ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-investment_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-investment_tracker}
      DB_SSL: ""
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # MUST stay /api (same-origin proxy) — never localhost:8000 or a server IP.
        NEXT_PUBLIC_API_BASE_URL: /api
        # Build-time only (baked into routes-manifest.json, see next.config.ts) — 127.0.0.1
        # inside this container is itself, not the backend container, so the server-side /api
        # rewrite must target the backend service by its Compose DNS name instead.
        BACKEND_INTERNAL_URL: http://backend:8000
    container_name: wealthsignal_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  wealthsignal_postgres_data:
